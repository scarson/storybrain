# storybrain-base — emergent-narrative world-memory taxonomy for an AI storyteller
#
# A STANDALONE gbrain schema pack (extends: null) for a Rimworld-style game whose
# story emerges from gameplay history and is driven by ARTIFACT HUNTING. See
# storybrain/DESIGN.md for the full rationale; this file is the machine-readable
# taxonomy.
#
# Activate (prototype phase):  gbrain schema use storybrain-base
# Edges auto-wire (zero LLM) from [[type/slug]] wikilinks in page bodies.
#
# primitives used: entity (people/places/things), temporal (dated records that
# feed timeline + find_trajectory), concept (abstract: plots, powers, beliefs),
# media (lore prose, extractable).

api_version: gbrain-schema-pack-v1
name: storybrain-base
version: 0.1.0
description: Emergent AI-storyteller world memory; artifacts as first-class story spine.
gbrain_min_version: 0.42.0
extends: null
borrow_from: []

takes_kinds:
  - fact      # established world truth ("Vera is the colony surgeon")
  - hunch     # the Director's working theory about a brewing arc

page_types:
  # ---- entities -----------------------------------------------------------
  - name: colonist
    primitive: entity
    path_prefixes: [colonists/, pawns/]
    aliases: [pawn, settler, character]
    extractable: false
    expert_routing: true        # "who knows surgery / who can negotiate"

  - name: faction
    primitive: entity
    path_prefixes: [factions/]
    aliases: [tribe, empire, clan, raiders]
    extractable: false
    expert_routing: true

  - name: location
    primitive: entity
    path_prefixes: [locations/, places/, sites/]
    subtypes:
      - { name: settlement, when: { path_pattern: "^locations/settlements/" } }
      - { name: ruin,       when: { path_pattern: "^locations/ruins/" } }
      - { name: huntsite,   when: { path_pattern: "^sites/" } }   # artifact dig sites
    aliases: [place, room, biome, region]
    extractable: false
    expert_routing: false

  - name: artifact
    primitive: entity            # FIRST-CLASS McGuffin. The story spine (DESIGN §4).
    path_prefixes: [artifacts/, relics/]
    subtypes:
      - { name: relic,    when: { frontmatter_field: tier, frontmatter_value: relic } }
      - { name: shard,    when: { frontmatter_field: fragment_of_set, frontmatter_value: true } }
      - { name: mundane,  when: { frontmatter_field: tier, frontmatter_value: mundane } }
    aliases: [relic, mcguffin, treasure, item]
    extractable: false
    expert_routing: false

  # ---- lore / world-building ---------------------------------------------
  - name: lore
    primitive: media
    path_prefixes: [lore/]
    subtypes:
      - { name: rumor,    when: { frontmatter_field: subtype, frontmatter_value: rumor } }     # foreshadow (pre-discovery)
      - { name: fragment, when: { frontmatter_field: subtype, frontmatter_value: fragment } }  # dropped by an artifact
      - { name: myth,     when: { frontmatter_field: subtype, frontmatter_value: myth } }
      - { name: codex,    when: { frontmatter_field: subtype, frontmatter_value: codex } }
      - { name: prophecy, when: { frontmatter_field: subtype, frontmatter_value: prophecy } }
    aliases: [legend, story, fragment, rumor]
    extractable: true

  - name: belief
    primitive: concept
    path_prefixes: [beliefs/, ideoligions/]
    aliases: [ideoligion, deity, religion, meme, ideology]
    extractable: true
    expert_routing: false

  # ---- temporal records ---------------------------------------------------
  - name: event
    primitive: temporal          # workhorse; every incident becomes one
    path_prefixes: [events/, incidents/]
    subtypes:
      - { name: raid,      when: { frontmatter_field: kind, frontmatter_value: raid } }
      - { name: social,    when: { frontmatter_field: kind, frontmatter_value: social } }
      - { name: disaster,  when: { frontmatter_field: kind, frontmatter_value: disaster } }
      - { name: quest,     when: { frontmatter_field: kind, frontmatter_value: quest } }    # artifact hunts
      - { name: discovery, when: { frontmatter_field: kind, frontmatter_value: discovery } } # the find
    aliases: [incident, beat]
    extractable: true

  - name: arc
    primitive: temporal          # an ACTIVE PLOT the Director steers (DESIGN §5)
    path_prefixes: [arcs/]
    # lifecycle lives in frontmatter: phase = seed|rumor|rising|climax|resolution|dormant
    aliases: [plot, thread, storyline]
    extractable: false
    expert_routing: false

  - name: chapter
    primitive: temporal          # LLM-written recap + compaction target ("Legends")
    path_prefixes: [chapters/, eras/]
    aliases: [era, recap, legend]
    extractable: false
    expert_routing: false

  # ---- abstract / mechanical ---------------------------------------------
  - name: power
    primitive: concept           # a boon an artifact grants (a page so it carries lore + balance)
    path_prefixes: [powers/, boons/]
    aliases: [boon, ability, blessing]
    extractable: false
    expert_routing: false

  - name: curse
    primitive: concept           # the dark side an artifact bears (risk/reward)
    path_prefixes: [curses/]
    aliases: [hex, malediction, blight]
    extractable: false
    expert_routing: false

  # ---- catch-all ----------------------------------------------------------
  - name: note
    primitive: concept
    path_prefixes: [notes/]
    aliases: [memo, scratch]
    extractable: true
    expert_routing: false

link_types:
  # social
  - { name: kin_of,     inverse: kin_of }
  - { name: rival_of,   inverse: rival_of }
  - { name: ally_of,    inverse: ally_of }
  - { name: lover_of,   inverse: lover_of }
  - { name: member_of,  inverse: has_member }

  # action / history
  - { name: killed,     inverse: killed_by }
  - { name: betrayed,   inverse: betrayed_by }
  - { name: saved,      inverse: saved_by }
  - { name: involves,   inverse: involved_in }    # event -> colonist/faction
  - { name: caused_by,  inverse: caused }          # event -> event (causal chains)

  # spatial
  - { name: located_at, inverse: location_of }
  - { name: occurred_at,inverse: site_of }          # event -> location

  # artifact spine (DESIGN §4)
  - { name: hidden_at,  inverse: hides }            # artifact -> location
  - { name: rumored_at, inverse: rumor_of }         # rumor lore -> location (foreshadow)
  - { name: sought_by,  inverse: seeks }            # artifact -> faction/colonist
  - { name: guarded_by, inverse: guards }           # artifact/site -> faction/beast
  - { name: grants,     inverse: granted_by }       # artifact -> power
  - { name: bears,      inverse: borne_by }          # artifact -> curse
  - { name: fragment_of,inverse: has_fragment }      # shard -> greater relic
  - { name: forged_by,  inverse: forged }            # artifact -> figure
  - { name: owned_by,   inverse: owns }              # artifact -> colonist/faction
  - { name: lost_in,    inverse: site_of_loss }      # artifact -> past event
  - { name: drops,      inverse: dropped_by }        # artifact -> lore fragment
  - { name: reveals,    inverse: revealed_by }       # lore -> figure/era/event

  # player-choice fate (agency feeds the graph)
  - { name: destroyed,  inverse: destroyed_by }
  - { name: sold,       inverse: sold_by }
  - { name: sealed,     inverse: sealed_by }
  - { name: ignored,    inverse: ignored_by }

  # arc wiring
  - { name: advances,   inverse: advanced_by }       # event -> arc
  - { name: resolves,   inverse: resolved_by }        # event -> arc
  - { name: worships,   inverse: worshipped_by }       # colonist/faction -> belief

# No mapping_rules: this is a greenfield pack for a new game, not a migration
# from an existing brain's accreted types.
